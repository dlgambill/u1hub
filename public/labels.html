<!DOCTYPE html>
<!-- labels.html — printable QR spool labels (v2.9 QR adapter).
     Each label encodes "u1spool:<spool_id>" — the Hub's OWN spool key, not the
     tag UID. That's the whole point of the spool_id indirection: a camera can't
     read an NFC UID, so QR rides the same engine by encoding the primary key
     directly. Scan with the Spools tab's "Scan QR label" (any camera, iOS
     included) → resolves exactly like an NFC tap.
     ?id=<spool_id> prints one label; no query prints every bound spool.
     QR encoder: vendored qrcode-generator (MIT, © Kazuhiko Arase). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spool labels — U1 Print Hub</title>
<link rel="icon" href="/icon-192.png">
<style>
  :root{ --ink:#111; --line:#bbb; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#fff; color:var(--ink); padding:18px;}
  .bar{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .bar h1{font-size:15px; margin:0;}
  .bar button{font:inherit; font-size:13px; padding:8px 16px; border:1px solid #888; border-radius:7px; background:#f4f4f4; cursor:pointer;}
  .bar a{font-size:12px; color:#555;}
  .hint{font-size:12px; color:#666; margin:0 0 14px;}
  .sheet{display:grid; grid-template-columns:repeat(auto-fill, 220px); gap:10px;}
  .label{border:1px dashed var(--line); border-radius:8px; padding:10px; display:flex; gap:10px; align-items:center; break-inside:avoid; page-break-inside:avoid;}
  .label .qr{width:96px; height:96px; flex:none;}
  .label .qr svg{width:100%; height:100%; display:block;}
  .meta{min-width:0; flex:1;}
  .meta .sw{width:100%; height:14px; border-radius:4px; border:1px solid #0003; margin-bottom:6px;}
  .meta .nm{font-size:11.5px; font-weight:700; line-height:1.25; word-break:break-word;}
  .meta .sub{font-size:9.5px; color:#555; margin-top:3px; line-height:1.3; word-break:break-word;}
  .meta .sid{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:8px; color:#888; margin-top:4px; word-break:break-all;}
  .empty{color:#666; font-size:13px;}
  @media print{ .bar,.hint{display:none;} body{padding:0;} .sheet{gap:6px;} .label{border-color:#999;} }
</style>
</head>
<body>
<div class="bar">
  <h1>Spool QR labels</h1>
  <button onclick="window.print()">Print</button>
  <a href="/">← dashboard</a>
</div>
<p class="hint">Stick each label on its spool. Scanning it in the Hub (Spools → Scan QR label) resolves the filament identity instantly — works on any phone with a camera, including iPhones. Labels survive dead NFC tags and spools that never had one.</p>
<div class="sheet" id="sheet"><span class="empty">Loading…</span></div>
<script src="/vendor/qrcode-generator.js"></script>
<script>
"use strict";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async () => {
  const sheet = document.getElementById("sheet");
  let spools = [];
  try { spools = (await (await fetch("/api/spools")).json()).spools || []; }
  catch (e) { sheet.innerHTML = '<span class="empty">Could not load spools: ' + esc(e.message) + "</span>"; return; }
  const only = new URLSearchParams(location.search).get("id");
  if (only) spools = spools.filter(s => s.spool_id === only);
  if (!spools.length) { sheet.innerHTML = '<span class="empty">No spools to label yet — bind one in the Spools tab first.</span>'; return; }
  const mk = (typeof qrcode === "function") ? qrcode : (window.qrcode && window.qrcode.qrcode);
  sheet.innerHTML = spools.map(s => {
    const qr = mk(0, "M"); qr.addData("u1spool:" + s.spool_id); qr.make();
    const n = qr.getModuleCount(), Q = 2, sz = n + Q * 2;
    let rects = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) rects += `<rect x="${c + Q}" y="${r + Q}" width="1" height="1"/>`;
    const svg = `<svg viewBox="0 0 ${sz} ${sz}" shape-rendering="crispEdges" fill="#000"><rect width="${sz}" height="${sz}" fill="#fff"/>${rects}</svg>`;
    const sub = [s.brand, s.material_variant].filter(Boolean).join(" · ")
      + (s.hot_end_temp ? ` · ${s.hot_end_temp}°/${s.bed_temp || "—"}°` : "");
    return `<div class="label"><div class="qr">${svg}</div><div class="meta">`
      + `<div class="sw" style="background:${esc((s.hexes&&s.hexes.length>=2)?(s.color_style==="gradient"?`linear-gradient(135deg,${s.hexes.map(h=>"#"+h).join(",")})`:`linear-gradient(135deg,${s.hexes.map((h,i)=>`#${h} ${Math.round(i*100/s.hexes.length)}% ${Math.round((i+1)*100/s.hexes.length)}%`).join(",")})`):("#"+s.hex))}"></div>`
      + `<div class="nm">${esc(s.color_name || ("#" + s.hex))}</div>`
      + (sub ? `<div class="sub">${esc(sub)}</div>` : "")
      + `<div class="sid">${esc(s.spool_id)}</div></div></div>`;
  }).join("");
})();
</script>
</body>
</html>
