# U1 Print Hub via Docker — for always-on hosts (Pi / NAS / homelab).
#
# Quick start:
#   mkdir -p data gcode                      # data = everything the Hub remembers,
#                                            # gcode = where your sliced .gcode lives
#   docker compose up -d
#   open http://<this-host-ip>:4545
#
# Upgrading: git pull, then `docker compose up -d --build`. Everything the Hub
# remembers lives in ./data on the host, so a rebuild keeps your printers,
# password, tunnel, spools, schedule and thumbnails. (Until 2026-09-09 this
# file only persisted config.json and gcode, so an upgrade lost the rest - if
# you set up under the old file, move ./config.json into ./data and copy the
# old container's spools.json, slots.json, dispatch.json, auth.json and
# tunnel.json in beside it once: docker cp u1-print-hub:/app/spools.json data/)
#
# Auto-discovery scans your LAN, which only works with host networking (Linux
# hosts). On Docker Desktop (macOS/Windows) host networking behaves differently —
# use the "ports" block instead and just add printers by IP in Settings.

services:
  u1-print-hub:
    # Build from this repo. (Once images are published you could instead use:
    #   image: ghcr.io/dlgambill/u1hub:latest )
    build: .
    container_name: u1-print-hub
    restart: unless-stopped

    # --- Linux hosts: host networking enables LAN auto-discovery ---
    network_mode: host

    # --- Docker Desktop (macOS/Windows): comment out network_mode above and
    #     uncomment this instead, then add printers by IP (discovery won't scan) ---
    # ports:
    #   - "4545:4545"

    # U1HUB_DIR (since 2.19) puts every stateful file - config.json, spools,
    # slots, schedule, password, tunnel, print history, the thumbnail cache -
    # in one directory instead of next to the code. One bind mount persists
    # all of it, including files added by future versions, so there is no
    # per-file list to keep in step with releases.
    environment:
      - U1HUB_DIR=/app/data

    volumes:
      - ./data:/app/data                 # everything the Hub remembers
      - ./gcode:/app/data/gcode          # your Orca output folder (printer-type
                                         #   subfolders are created inside it);
                                         #   config's default "./gcode" resolves
                                         #   relative to U1HUB_DIR, hence this path
